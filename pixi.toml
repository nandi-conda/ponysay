# Pixi manifest for the ponysay project.
#
# The upstream ponysay checkout (with the emo `dear diary, ...` quote set)
# lives in `ponysay/`.  The build is pure Python once the optional
# info/man/shell extras are disabled, so `python` is the only dependency we
# declare.  Texinfo (`makeinfo`) is intentionally NOT declared: it is only
# needed for the optional info manual, and the default build task pins it away
# with `--without-info`.
#
# See PIXI-VALIDATION.md for the clean-environment validation of these tasks.

[workspace]
name = "ponysay"
version = "3.0.4"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# 2016-era ponysay runs on Python 3; the upper bound keeps the lock away from
# versions that emit deprecation warnings for its old escape sequences.
python = ">=3.8,<3.14"

[tasks]

# Build ponysay without the optional info/man/shell extras.  `--without-info`
# is required on systems without texinfo/makeinfo.
build = "cd ponysay && python3 setup.py --freedom=partial --without-info --without-man --without-shell build"

# Compile only the quote data (`ponyquotes/*.<N>` -> `quotes/<group>.<N>`),
# reproducing the quote-compiler step of `setup.py build`.
quotes = "cd ponysay && python3 ../scripts/compile-quotes.py"

# Install ponysay into the pixi environment.  `setup.py install` performs the
# build itself, so this task does not need an explicit `build` dependency.
# `--prefix` is what bakes the pixi environment's share directory into the
# generated zipapp (unlike `prebuilt`, which installs an already-built zipapp
# whose data paths would still point at `/usr/share/ponysay`), and
# `--without-shared-cache` keeps a non-root install from trying to create
# `/var/cache/ponysay`.
install = "cd ponysay && python3 setup.py --freedom=partial --without-info --without-man --without-shell --without-shared-cache --prefix \"$PIXI_PROJECT_ROOT/.pixi/envs/default\" install"

# Run the installed ponysay with arbitrary arguments, e.g.
# `pixi run ponysay -q twilight` or `pixi run ponysay -l`.  Depends on
# `install` so it also works from a clean checkout.
ponysay = { cmd = "\"$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/ponysay\"", depends-on = ["install"] }

# Install into the pixi environment and render a sample emo quote.  This is a
# smoke test for the `install` + `ponysay` tasks above.
smoke = { cmd = "\"$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/ponysay\" -q twilight", depends-on = ["install"] }
