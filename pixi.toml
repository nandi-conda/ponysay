# Pixi manifest for the ponysay project.
#
# This repository *is* the ponysay source tree (the emo `dear diary, ...`
# quote set included), so the tasks below run `setup.py` from the repo root.
# The build is pure Python once the optional info/man/shell extras are
# disabled, so `python` is the only dependency we declare.  Texinfo
# (`makeinfo`) is intentionally NOT declared: it is only needed for the
# optional info manual, and the default build task pins it away with
# `--without-info`.
#
# See docs/notes/PIXI-VALIDATION.md for the clean-environment validation of
# these tasks.

[workspace]
name = "ponysay"
version = "3.0.4"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# 2016-era ponysay runs on Python 3; the upper bound keeps the lock away from
# versions that emit deprecation warnings for its old escape sequences.
python = ">=3.8,<3.14"

[tasks]

# Build ponysay without the optional info/man/shell extras.  `--without-info`
# is required on systems without texinfo/makeinfo.
build = "python3 setup.py --freedom=partial --without-info --without-man --without-shell build"

# Compile only the quote data (`ponyquotes/*.<N>` -> `quotes/<group>.<N>`),
# reproducing the quote-compiler step of `setup.py build`.
quotes = "python3 scripts/compile-quotes.py"

# Install ponysay into the pixi environment.  `setup.py install` performs the
# build itself, so this task does not need an explicit `build` dependency.
# `--prefix` is what bakes the pixi environment's share directory into the
# generated zipapp (unlike `prebuilt`, which installs an already-built zipapp
# whose data paths would still point at `/usr/share/ponysay`), and
# `--without-shared-cache` keeps a non-root install from trying to create
# `/var/cache/ponysay`.
install = "python3 setup.py --freedom=partial --without-info --without-man --without-shell --without-shared-cache --prefix \"$PIXI_PROJECT_ROOT/.pixi/envs/default\" install"

# Run the installed ponysay.  With no arguments this prints a random quote
# from a random pony (`ponysay -q`).  `--emo` (or `-e`) restricts the choice
# to the ponies tagged `EMO: yes` and prints one of their quotes
# (`ponysay -r emo=yes -q`), and `--list-emo` prints the names of those
# ponies, one per line, and exits 0.  Pass-through arguments such as
# `-q twilight` or `-l` work too.  The wrapper installs quietly on first use,
# so this does not depend on the verbose `install` task and stays clean.
ponysay = "sh \"$PIXI_PROJECT_ROOT/scripts/ponysay-run.sh\""

# Install into the pixi environment and render a sample emo quote.  This is a
# smoke test for the `install` + `ponysay` tasks above.
smoke = { cmd = "\"$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/ponysay\" -q twilight", depends-on = ["install"] }
